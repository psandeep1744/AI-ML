<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Login — Kynovia AI Clinical Intelligence</title>
  <meta name="description" content="Secure portal login for patients and healthcare providers in Bengaluru, India." />

  <!-- Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Custom Stitch UI Theme -->
  <link href="/css/stitch-theme.css" rel="stylesheet" />
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Minimal Header -->
  <header class="py-3 bg-white border-bottom">
    <div class="container-xl d-flex align-items-center justify-content-between">
      <a href="/" class="d-flex align-items-center gap-2.5 text-decoration-none">
        <img
          src="https://lh3.googleusercontent.com/aida/AEtjO1Xx-kJ2Q-LJKYwuLn-WuEUC3SMm5m67OnsT3jO0fA1xDtuYT7zJx7yQ8Yfw9b4nIAitmuCVI74cCRyAkxKIgQaIRF-qU-qc_dPR6FsBoJ72WOumBv1I62H-IBQEoQClQRufDi5WUZA3mCdNhcPRz3poGGBKAw55PwU2GfFNAi1OH92xf0Q0NoWt22bw8PROz9nC1NpS572uaj07GImVXd-fohHA8DXpjMal402cCeC9A3TfDvMOUnsubwp35pbcooGPqngVZUYkLOA"
          alt="Kynovia AI"
          class="kyn-logo-img"
        />
        <div class="d-flex flex-column">
          <span class="font-headline font-weight-bold text-dark text-uppercase" style="font-size: 1.05rem; line-height: 1;">Kynovia</span>
          <span class="font-body text-uppercase font-weight-bold" style="font-size: 9px; color: var(--kyn-teal); letter-spacing: 0.08em;">Clinical Intelligence</span>
        </div>
      </a>

      <div class="d-flex align-items-center gap-2">
        <span class="text-muted d-none d-sm-inline" style="font-size: 0.8rem;">Don't have an account?</span>
        <a href="/register.html" class="btn btn-sm kyn-btn-outline py-1 px-3">Register</a>
      </div>
    </div>
  </header>

  <!-- Login Form Chamber -->
  <main class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="w-100" style="max-width: 440px;">
      <div class="kyn-card p-4 p-md-5 shadow-sm">
        <div class="text-center mb-4">
          <h1 class="font-headline font-weight-bold text-dark mb-1" style="font-size: 1.5rem;">Welcome to Kynovia</h1>
          <p class="text-muted" style="font-size: 0.85rem;">Access your clinical portal or doctor workstation</p>
        </div>

        <!-- Auth Tabs: Email vs Indian OTP -->
        <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-pill border" id="authTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active rounded-pill font-weight-bold py-1.5" id="email-tab" data-bs-toggle="pill" data-bs-target="#email-pane" type="button" style="font-size: 12px;">
              Email & Password
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link rounded-pill font-weight-bold py-1.5" id="otp-tab" data-bs-toggle="pill" data-bs-target="#otp-pane" type="button" style="font-size: 12px;">
              Indian Mobile OTP
            </button>
          </li>
        </ul>

        <div class="tab-content" id="authTabsContent">
          <!-- EMAIL & PASSWORD PANE -->
          <div class="tab-pane fade show active" id="email-pane" role="tabpanel">
            <form id="email-login-form">
              <div class="mb-3">
                <label class="form-label font-headline font-weight-bold" style="font-size: 0.8rem;">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0">
                    <span class="material-symbols-outlined text-muted" style="font-size: 18px;">mail</span>
                  </span>
                  <input type="email" id="login-email" class="form-control border-start-0" placeholder="name@kynovia.health" required />
                </div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                  <label class="form-label font-headline font-weight-bold" style="font-size: 0.8rem;">Password</label>
                  <a href="#" class="text-muted text-decoration-none" style="font-size: 11px;">Forgot?</a>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0">
                    <span class="material-symbols-outlined text-muted" style="font-size: 18px;">lock</span>
                  </span>
                  <input type="password" id="login-password" class="form-control border-start-0" placeholder="••••••••" required />
                </div>
              </div>

              <button type="submit" id="email-submit-btn" class="btn kyn-btn-primary w-100 py-2 font-weight-bold mb-3">
                Sign In
              </button>
            </form>
          </div>

          <!-- INDIAN MOBILE OTP PANE -->
          <div class="tab-pane fade" id="otp-pane" role="tabpanel">
            <form id="otp-login-form">
              <div class="mb-3" id="otp-mobile-group">
                <label class="form-label font-headline font-weight-bold" style="font-size: 0.8rem;">Mobile Number (+91 India)</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 font-weight-bold text-muted" style="font-size: 12px;">+91</span>
                  <input type="tel" id="login-mobile" class="form-control border-start-0" placeholder="98765 43210" maxlength="10" />
                </div>
                <div class="form-text" style="font-size: 11px;">A 6-digit verification code will be dispatched.</div>
              </div>

              <div class="mb-3 d-none" id="otp-code-group">
                <div class="d-flex justify-content-between align-items-center">
                  <label class="form-label font-headline font-weight-bold" style="font-size: 0.8rem;">Enter 6-Digit OTP</label>
                  <span class="badge bg-teal-light text-teal font-weight-bold" id="demo-otp-badge"></span>
                </div>
                <input type="text" id="login-otp" class="form-control text-center font-headline font-weight-bold letter-spacing-1" placeholder="• • • • • •" maxlength="6" style="font-size: 1.2rem;" />
              </div>

              <button type="button" id="send-otp-btn" class="btn kyn-btn-primary w-100 py-2 font-weight-bold mb-3" onclick="requestOtp()">
                Send OTP
              </button>
              <button type="button" id="verify-otp-btn" class="btn kyn-btn-primary w-100 py-2 font-weight-bold mb-3 d-none" onclick="verifyOtpCode()">
                Verify & Login
              </button>
            </form>
          </div>
        </div>

        <!-- 1-Click Fast Demo Login Strip -->
        <div class="pt-3 border-top mt-3">
          <div class="text-muted text-center text-uppercase font-weight-bold mb-2" style="font-size: 10px; letter-spacing: 0.05em;">
            1-Click Demo Accounts
          </div>
          <div class="d-flex flex-column gap-2">
            <button class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-between py-1.5 px-3" onclick="fillDemo('patient@kynovia.ai', 'Kynovia@2026')">
              <span class="d-flex align-items-center gap-1.5">
                <span class="material-symbols-outlined text-primary" style="font-size: 16px;">person</span>
                <strong>Patient:</strong> Rahul Sharma
              </span>
              <span class="badge bg-light text-muted border">Auto-fill</span>
            </button>
            <button class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-between py-1.5 px-3" onclick="fillDemo('rajeshwar.sharma@kynovia.ai', 'Kynovia@2026')">
              <span class="d-flex align-items-center gap-1.5">
                <span class="material-symbols-outlined text-teal" style="font-size: 16px;">stethoscope</span>
                <strong>Doctor:</strong> Dr. Rajeshwar Sharma
              </span>
              <span class="badge bg-light text-muted border">Auto-fill</span>
            </button>
            <button class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-between py-1.5 px-3" onclick="fillDemo('admin@kynovia.ai', 'Kynovia@2026')">
              <span class="d-flex align-items-center gap-1.5">
                <span class="material-symbols-outlined text-danger" style="font-size: 16px;">shield_person</span>
                <strong>Admin:</strong> Console Admin
              </span>
              <span class="badge bg-light text-muted border">Auto-fill</span>
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>

  <script>
    function fillDemo(email, pass) {
      document.getElementById('email-tab').click();
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pass;
      document.getElementById('email-login-form').dispatchEvent(new Event('submit'));
    }

    document.getElementById('email-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      const btn = document.getElementById('email-submit-btn');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Signing In...';

      try {
        const res = await API.login(email, pass);
        UI.showToast(`Welcome back, ${res.user.full_name}!`, 'success');

        setTimeout(() => {
          if (res.user.role === 'doctor') {
            window.location.href = '/doctor-dashboard.html';
          } else if (res.user.role === 'admin') {
            window.location.href = '/admin-dashboard.html';
          } else {
            window.location.href = '/';
          }
        }, 600);
      } catch (err) {
        UI.showToast(err.message || 'Invalid email or password.', 'error');
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    });

    async function requestOtp() {
      const mobile = document.getElementById('login-mobile').value.trim();
      if (!mobile || mobile.length < 10) {
        UI.showToast('Please enter a valid 10-digit Indian mobile number.', 'error');
        return;
      }

      const btn = document.getElementById('send-otp-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Dispatching OTP...';

      try {
        const res = await API.sendOtp(mobile);
        UI.showToast(res.message || 'OTP sent successfully!', 'success');
        document.getElementById('otp-code-group').classList.remove('d-none');
        document.getElementById('send-otp-btn').classList.add('d-none');
        document.getElementById('verify-otp-btn').classList.remove('d-none');
        if (res.demo_otp) {
          document.getElementById('demo-otp-badge').innerText = `Demo OTP: ${res.demo_otp}`;
          document.getElementById('login-otp').value = res.demo_otp;
        }
      } catch (err) {
        UI.showToast(err.message || 'Failed to dispatch OTP.', 'error');
        btn.disabled = false;
        btn.innerHTML = 'Send OTP';
      }
    }

    async function verifyOtpCode() {
      const mobile = document.getElementById('login-mobile').value.trim();
      const otp = document.getElementById('login-otp').value.trim();
      if (!otp || otp.length !== 6) {
        UI.showToast('Please enter the 6-digit OTP code.', 'error');
        return;
      }

      const btn = document.getElementById('verify-otp-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Verifying...';

      try {
        const res = await API.verifyOtp(mobile, otp);
        UI.showToast(`Verified! Welcome ${res.user.full_name}`, 'success');
        setTimeout(() => {
          if (res.user.role === 'doctor') {
            window.location.href = '/doctor-dashboard.html';
          } else {
            window.location.href = '/';
          }
        }, 600);
      } catch (err) {
        UI.showToast(err.message || 'Invalid or expired OTP.', 'error');
        btn.disabled = false;
        btn.innerHTML = 'Verify & Login';
      }
    }
  </script>
</body>
</html>
